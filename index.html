<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dshopp - Tienda de Ropa y Accesorios</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-main: #111111;
            --text-muted: #6c757d;
            --accent-green: #25d366;
            --accent-green-hover: #1ebe5d;
            --border-color: #e9ecef;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: var(--font-family); 
            background: var(--bg-primary); 
            color: var(--text-main);
            margin: 0; 
            padding: 24px 16px; 
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Encabezado Principal */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-info h1 { 
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .brand-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        #img_logo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }

        /* Sección Acerca de Dshopp */
        .about-card {
            background: var(--bg-secondary);
            padding: 18px 20px;
            border-radius: 12px;
            margin-bottom: 32px;
        }

        .about-card h2 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .about-card p {
            font-size: 0.92rem;
            color: #495057;
            line-height: 1.5;
        }

        /* Título del Catálogo */
        .section-title { 
            text-align: center; 
            color: var(--text-main); 
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 24px; 
        }
        
        /* Grid de Productos */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 28px 16px; 
        }

        .card { 
            background: var(--bg-primary); 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid var(--border-color);
            display: flex; 
            flex-direction: column; 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }
        
        .card img { 
            width: 100%; 
            aspect-ratio: 1 / 1;
            object-fit: cover; 
            background: var(--bg-secondary); 
        }

        .card-content { 
            padding: 14px; 
            display: flex; 
            flex-direction: column; 
            flex-grow: 1; 
        }
        
        .category { 
            font-size: 0.68rem; 
            text-transform: uppercase; 
            color: var(--text-muted); 
            font-weight: 700; 
            letter-spacing: 0.5px;
            margin-bottom: 4px; 
        }

        .card h3 { 
            font-size: 0.95rem; 
            font-weight: 600;
            margin: 0 0 10px; 
            color: var(--text-main); 
            line-height: 1.3;
        }
        
        .price-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: auto; 
            margin-bottom: 12px;
        }

        .price { 
            color: var(--text-main); 
            font-weight: 700; 
            font-size: 1.05rem; 
        }

        .status { 
            font-size: 0.65rem; 
            padding: 3px 8px; 
            border-radius: 4px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.3px;
        }
        
        .status.disponible, .status.entregado { 
            background: #e8f8f5; 
            color: #27ae60; 
        }

        .status.pendiente { 
            background: #fff9e6; 
            color: #f39c12; 
        }

        /* Botón Pedir por WhatsApp */
        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--accent-green);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: center;
            transition: background 0.2s ease;
        }

        .btn-whatsapp:hover {
            background: var(--accent-green-hover);
        }
        
        .loading { 
            text-align: center; 
            color: var(--text-muted); 
            margin-top: 40px; 
            grid-column: 1 / -1; 
            font-size: 1rem; 
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 16px 12px;
            }
            .card-content {
                padding: 10px;
            }
            .card h3 {
                font-size: 0.88rem;
            }
            .price {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Encabezado con Logo alineado -->
        <header>
            <div class="brand-info">
                <h1>Dshopp</h1>
                <p>Prendas & Accesorios</p>
            </div>
            <img id="img_logo" src="https://lh3.googleusercontent.com/d/1IHnjFZOLZE7M9kaquk_gBUiZCAUtWxHB" alt="Logo Dshopp" />
        </header>

        <!-- Bloque Acerca de -->
        <section class="about-card">
            <h2>¿Qué es Dshopp?</h2>
            <p>¡Hola! Soy Denis. Te presento <strong>Dshopp</strong>, una tienda de prendas y accesorios pensados para cada ocasión, combinando calidad y precios adaptados a ti.</p>
        </section>

        <!-- Catálogo -->
        <h2 class="section-title">Productos Disponibles</h2>

        <div id="catalogo" class="grid">
            <div class="loading">Cargando catálogo...</div>
        </div>
    </div>

    <script>
        // 🔑 Tu enlace CSV publicado de Google Sheets
        const URL_DATOS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRstuG3-mPUfpGALGmtisWN-nbTcV9qnEO0elsNKrTgusWs7BKkfmxsUFOMmrewBCP7ma0IefjTgUsj/pub?output=csv";
        
        // 📱 Coloca tu número de WhatsApp con código de país (ejemplo: 595981123456)
        const NUMERO_WHATSAPP = "595993 349576"; 

        async function cargarCatalogo() {
            try {
                const response = await fetch(URL_DATOS);
                const dataText = await response.text();
                const lineas = dataText.split("\n");
                const contenedor = document.getElementById("catalogo");
                contenedor.innerHTML = "";

                let contador = 0;

                for (let i = 1; i < lineas.length; i++) {
                    const fila = lineas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    
                    if (fila.length >= 5 && fila[0].trim() !== "") {
                        const producto = fila[1] ? fila[1].replace(/"/g, '').trim() : "Sin nombre";
                        const categoria = fila[2] ? fila[2].replace(/"/g, '').trim() : "General";
                        const imagen = fila[4] ? fila[4].replace(/"/g, '').trim() : "";
                        const precioRaw = fila[8] ? fila[8].replace(/"/g, '').trim() : "0";
                        const estado = fila[13] ? fila[13].replace(/"/g, '').trim() : "Disponible";

                        contador++;
                        const estadoClase = estado.toLowerCase();
                        
                        // Formateador simple de precio si es numérico
                        let precioFormateado = precioRaw;
                        if (!isNaN(precioRaw.replace(/[^0-9]/g, '')) && precioRaw !== "") {
                            precioFormateado = "$" + precioRaw;
                        }

                        // Enlace directo a WhatsApp con texto automático
                        const mensajeWp = encodeURIComponent(`Hola Denis, me interesa consultar por  "${producto}" (${categoria}) con precio ${precioFormateado}.`);
                        const linkWp = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensajeWp}`;

                        const card = document.createElement("div");
                        card.className = "card";
                        card.innerHTML = `
                            <img src="${imagen}" alt="${producto}" onerror="this.src='https://via.placeholder.com/200?text=Sin+Imagen'">
                            <div class="card-content">
                                <span class="category">${categoria}</span>
                                <h3>${producto}</h3>
                                <div class="price-row">
                                    <span class="price">${precioFormateado}</span>
                                    <span class="status ${estadoClase}">${estado}</span>
                                </div>
                                <a href="${linkWp}" target="_blank" class="btn-whatsapp">
                                    Pedir por WhatsApp
                                </a>
                            </div>
                        `;
                        contenedor.appendChild(card);
                    }
                }

                if (contador === 0) {
                    contenedor.innerHTML = "<p class='loading'>No hay productos disponibles para mostrar por el momento.</p>";
                }

            } catch (error) {
                document.getElementById("catalogo").innerHTML = "<p class='loading' style='color:red;'>Error al conectar con el catálogo de Dshopp.</p>";
                console.error("Detalle del error:", error);
            }
        }

        cargarCatalogo();
    </script>
</body>
  </html>
