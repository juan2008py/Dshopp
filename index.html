<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIDESX - Tienda de Ropa , Calzados y Accesorios</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-main: #111111;
            --text-muted: #6c757d;
            --accent-green: #25d366;
            --accent-green-hover: #1ebe5d;
            --border-color: #e9ecef;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: var(--font-family); 
            background: var(--bg-primary); 
            color: var(--text-main);
            padding: 24px 16px; 
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-info h1 { font-size: 1.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: -0.5px; }
        .brand-info p { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        #img_logo {
  width: 64px;
  height: 64px;
  object-fit: contain;
  border-radius: 50%;
  border: 2px solid #e9ecef;
  background: #fff;
}

        .about-card {
            background: var(--bg-secondary); padding: 18px 20px; border-radius: 12px; margin-bottom: 32px;
        }
        .about-card h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
        .about-card p { font-size: 0.92rem; color: #495057; line-height: 1.5; }

        .section-title { text-align: center; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 24px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px 16px; }

        .card { 
            background: var(--bg-primary); border-radius: 10px; overflow: hidden; border: 1px solid var(--border-color);
            display: flex; flex-direction: column; transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        
        .card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: var(--bg-secondary); }

        .card-content { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; }
        
        .category { font-size: 0.68rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
        .card h3 { font-size: 0.95rem; font-weight: 600; margin: 0 0 10px; line-height: 1.3; }
        
        .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; margin-bottom: 12px; }
        .price { color: var(--text-main); font-weight: 700; font-size: 1.05rem; }

        .status { font-size: 0.65rem; padding: 3px 8px; border-radius: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
        .status.disponible, .status.entregado { background: #e8f8f5; color: #27ae60; }
        .status.pendiente { background: #fff9e6; color: #f39c12; }
        .status.fuera_de_stock { background: #fde8e8; color: #e74c3c; }

        .btn-whatsapp {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background: var(--accent-green); color: #ffffff; text-decoration: none;
            font-size: 0.82rem; font-weight: 700; padding: 8px 12px; border-radius: 6px; text-align: center;
            transition: background 0.2s ease;
        }
        .btn-whatsapp:hover { background: var(--accent-green-hover); }
        
        .loading { text-align: center; color: var(--text-muted); margin-top: 40px; grid-column: 1 / -1; font-size: 1rem; }

        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 16px 12px; }
            .card-content { padding: 10px; }
            .card h3 { font-size: 0.88rem; }
            .price { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand-info">
                <h1>NIDESX</h1>
                <p>Ropas , Calzados y Accesorios</p>
            </div>
            <img id="img_logo" src="NidesX.jpg" alt="Logo Dshopp" />
        </header>

        <section class="about-card">
            <h2>¿Qué es NIDESX?</h2>
            <p>¡Hola! Soy Denis. Te presento <strong>NIDESX</strong>, una tienda de prendas y accesorios pensados para cada ocasión, combinando calidad y precios adaptados a ti.</p>
        </section>

        <h2 class="section-title">Productos Disponibles</h2>

        <div id="catalogo" class="grid">
            <div class="loading">Cargando catálogo...</div>
        </div>
    </div>

    <script>
        const URL_DATOS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRstuG3-mPUfpGALGmtisWN-nbTcV9qnEO0elsNKrTgusWs7BKkfmxsUFOMmrewBCP7ma0IefjTgUsj/pub?output=csv";
        const NUMERO_WHATSAPP = "595993349576";

        async function cargarCatalogo() {
            try {
                const response = await fetch(URL_DATOS + "&t=" + new Date().getTime());
                const dataText = await response.text();
                const lineas = dataText.replace(/\r/g, "").split("\n");
                const contenedor = document.getElementById("catalogo");

                if (lineas.length < 2) {
                    contenedor.innerHTML = "<p class='loading'>No se encontraron datos en el catálogo.</p>";
                    return;
                }

                const encabezados = lineas[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(h => h.replace(/"/g, '').trim());
                
                let HTMLFinal = "";
                let contador = 0;

                for (let i = 1; i < lineas.length; i++) {
                    if (!lineas[i].trim()) continue;

                    const fila = lineas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    
                    if (fila.length >= 2) {
                        let item = {};
                        encabezados.forEach((header, index) => {
                            item[header] = fila[index] ? fila[index].replace(/"/g, '').trim() : "";
                        });

                        // Filtro estricto: solo procesar filas que posean un ID válido (que empiece con 'Prod')
                        const idProd = item["ID"] || "";
                        if (!idProd.toLowerCase().includes("prod")) continue;

                        const producto = item["Producto"] || "Sin nombre";
                        const categoria = item["Categoría"] || "General";
                        // Lee de forma inteligente la URL pública de AppSheet o el respaldo local
                        const imagen = item["imagen URL"] || item["imágen"] || "";
                        const precio = item["Precio De Venta"] || "Consultar";
                        const estado = item["Estado"] || "Disponible";

                        contador++;
                        const estadoClase = estado.toLowerCase().replace(/\s+/g, '_');
                        
                        const mensajeWp = encodeURIComponent(`Hola Denis, me interesa consultar por el producto "${producto}" (${categoria}) con precio ${precio}.`);
                        const linkWp = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensajeWp}`;

                        HTMLFinal += `
                            <div class="card">
                                <img src="${imagen}" alt="${producto}" onerror="this.src='https://via.placeholder.com/200?text=Sin+Imagen'">
                                <div class="card-content">
                                    <span class="category">${categoria}</span>
                                    <h3>${producto}</h3>
                                    <div class="price-row">
                                        <span class="price">${precio}</span>
                                        <span class="status ${estadoClase}">${estado}</span>
                                    </div>
                                    <a href="${linkWp}" target="_blank" class="btn-whatsapp">
                                        Pedir por WhatsApp
                                    </a>
                                </div>
                            </div>
                        `;
                    }
                }

                if (contador === 0) {
                    contenedor.innerHTML = "<p class='loading'>No hay productos disponibles por el momento.</p>";
                } else {
                    contenedor.innerHTML = HTMLFinal;
                }

            } catch (error) {
                document.getElementById("catalogo").innerHTML = "<p class='loading' style='color:red;'>Error al conectar con el catálogo de Dshopp.</p>";
                console.error("Detalle del error:", error);
            }
        }

        cargarCatalogo();
    </script>
</body>
</html>
